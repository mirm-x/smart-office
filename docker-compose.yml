services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart_office
      POSTGRES_PASSWORD: smart_office
      POSTGRES_DB: smart_office
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_office -d smart_office"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
