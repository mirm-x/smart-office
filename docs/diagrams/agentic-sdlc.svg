<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="60" y="60" font-size="34" font-weight="700" fill="#0f172a">Agentic SDLC</text>
  <text x="60" y="92" font-size="18" fill="#475569">AI agents drive each phase; humans own the acceptance gates &#8212; Smart Office workflow</text>

  <!-- Legend -->
  <g font-size="15" fill="#334155">
    <rect x="880" y="44" width="20" height="20" rx="4" fill="#2563eb"/>
    <text x="908" y="59">Agent step</text>
    <rect x="1010" y="44" width="20" height="20" rx="4" fill="#f59e0b"/>
    <text x="1038" y="59">Human gate</text>
  </g>

  <!-- ROW 1 (left to right) -->
  <!-- Brief -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="200" height="86" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="160" y="188" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Brief</text>
  <text x="160" y="212" font-size="13" fill="#475569" text-anchor="middle">Client story / need</text>

  <!-- Agent refinement -->
  <g filter="url(#shadow)">
    <rect x="330" y="150" width="200" height="86" rx="14" fill="#2563eb"/>
  </g>
  <text x="430" y="188" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Agent refinement</text>
  <text x="430" y="212" font-size="13" fill="#dbeafe" text-anchor="middle">Clarify requirements</text>

  <!-- Human acceptance criteria -->
  <g filter="url(#shadow)">
    <rect x="600" y="150" width="200" height="86" rx="14" fill="#f59e0b"/>
  </g>
  <text x="700" y="182" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">Human acceptance</text>
  <text x="700" y="204" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">criteria</text>

  <!-- Agent plan -->
  <g filter="url(#shadow)">
    <rect x="870" y="150" width="200" height="86" rx="14" fill="#2563eb"/>
  </g>
  <text x="970" y="188" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Agent plan</text>
  <text x="970" y="212" font-size="13" fill="#dbeafe" text-anchor="middle">Approach &amp; tasks</text>

  <!-- Row1 arrows -->
  <line x1="260" y1="193" x2="326" y2="193" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="193" x2="596" y2="193" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="193" x2="866" y2="193" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Down connector from Agent plan to row 2 -->
  <path d="M970,236 L970,300 L970,326" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ROW 2 (right to left) -->
  <!-- Human design approval -->
  <g filter="url(#shadow)">
    <rect x="870" y="330" width="200" height="86" rx="14" fill="#f59e0b"/>
  </g>
  <text x="970" y="362" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">Human design</text>
  <text x="970" y="384" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">approval</text>

  <!-- Implementation -->
  <g filter="url(#shadow)">
    <rect x="600" y="330" width="200" height="86" rx="14" fill="#2563eb"/>
  </g>
  <text x="700" y="368" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Implementation</text>
  <text x="700" y="392" font-size="13" fill="#dbeafe" text-anchor="middle">Build the change</text>

  <!-- Independent checks / review -->
  <g filter="url(#shadow)">
    <rect x="330" y="330" width="200" height="86" rx="14" fill="#2563eb"/>
  </g>
  <text x="430" y="362" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Independent</text>
  <text x="430" y="384" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">checks / review</text>

  <!-- Correction -->
  <g filter="url(#shadow)">
    <rect x="60" y="330" width="200" height="86" rx="14" fill="#2563eb"/>
  </g>
  <text x="160" y="368" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Correction</text>
  <text x="160" y="392" font-size="13" fill="#dbeafe" text-anchor="middle">Fix &amp; re-verify</text>

  <!-- Row2 arrows (right to left) -->
  <line x1="866" y1="373" x2="800" y2="373" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="596" y1="373" x2="530" y2="373" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="326" y1="373" x2="260" y2="373" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Correction loops back up to Implementation (failed check returns to implementation) -->
  <path d="M160,330 L160,270 L700,270 L700,326" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowLoop)"/>
  <text x="430" y="262" font-size="13" font-weight="600" fill="#dc2626" text-anchor="middle">failed check &#8594; back to implementation</text>

  <!-- Down connector from Correction to final acceptance -->
  <path d="M160,416 L160,470 L160,496" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ROW 3: Human acceptance (final) -->
  <g filter="url(#shadow)">
    <rect x="60" y="500" width="260" height="86" rx="14" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="190" y="538" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Human acceptance</text>
  <text x="190" y="562" font-size="13" fill="#7c2d12" text-anchor="middle">Owner signs off &#8226; traceable to a requirement</text>

  <!-- Traceability note -->
  <g>
    <rect x="600" y="470" width="620" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="624" y="502" font-size="16" font-weight="700" fill="#0f172a">Every agent task is traceable to:</text>
    <text x="624" y="530" font-size="14" fill="#334155">1. Requirement &#8226;  2. Input material &#8226;  3. Allowed tools</text>
    <text x="624" y="554" font-size="14" fill="#334155">4. Expected artifact &#8226;  5. Acceptance checks &#8226;  6. Human owner</text>
    <text x="624" y="590" font-size="13" fill="#dc2626">A failed check &#8594; implementation. A disputed requirement &#8594; product lead.</text>
  </g>
</svg>
